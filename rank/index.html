<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f8f8fa">
  <title>RANK</title>
  <!-- Offline build: React + Tailwind output are bundled locally (no CDN, no in-browser Babel).
       Source lives in rank/src/ ; rebuild with `npm run build:rank`. -->
  <link rel="stylesheet" href="rank.css">
  <style>@font-face{font-family:'Inter';font-style:normal;font-weight:400 900;font-display:swap;src:url('../fonts/Inter-Variable.woff2') format('woff2')}</style>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',-apple-system,sans-serif;background:#f8f8fa;color:#2a2a3e;overflow-x:hidden}
    @keyframes revealPop{0%{transform:scale(1)}30%{transform:scale(0.92)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
    @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
    .anim-pop{animation:revealPop 0.5s ease-out}
    .anim-slide{animation:slideUp 0.5s ease-out both}
    .anim-fade{animation:fadeIn 0.4s ease-out both}
    .anim-pulse{animation:pulse 2s ease-in-out infinite}
  </style>
</head>
<body>
  <a href="../app.html" style="position:fixed;top:calc(env(safe-area-inset-top, 0px) + 12px);left:12px;z-index:999;display:flex;align-items:center;gap:8px;text-decoration:none;padding:6px 14px 6px 6px;background:rgba(19,26,43,0.9);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.15);"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px;border-radius:6px;"><rect width="1024" height="1024" rx="224" fill="#131A2B"/><g transform="translate(512, 180)"><g fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"><line x1="-180" y1="660" x2="0" y2="0"/><line x1="180" y1="660" x2="0" y2="0"/><line x1="-100" y1="460" x2="100" y2="460"/></g><polygon points="0,-90 -85,30 0,-5 85,30" fill="#E8A317"/></g></svg><span style="font-family:'Inter',-apple-system,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:rgba(255,255,255,0.9);">ACUMEN · HOME</span></a>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100dvh;color:#c89818;font-family:sans-serif;font-weight:900;font-size:32px;letter-spacing:8px">RANK</div>
  </div>
  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
  <script src="../daily.js"></script>
  <script src="../acumen-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
