<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Threads">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Threads</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Threads</h1>
      <p class="subtitle">Group 4 words that share a thread</p>
    </header>

    <!-- Solved groups appear here -->
    <div id="solved-area"></div>

    <!-- Word grid -->
    <div id="grid"></div>

    <!-- Mistakes -->
    <div id="mistakes">
      Mistakes remaining:
      <span id="mistake-dots"></span>
    </div>

    <!-- Action buttons -->
    <div id="actions">
      <button id="btn-shuffle" class="btn btn-secondary">Shuffle</button>
      <button id="btn-deselect" class="btn btn-secondary" disabled>Deselect All</button>
      <button id="btn-submit" class="btn btn-primary" disabled>Submit</button>
    </div>

    <!-- Game over overlay -->
    <div id="overlay" class="hidden">
      <div id="overlay-content">
        <h2 id="overlay-title"></h2>
        <div id="overlay-results"></div>
        <div id="overlay-answers"></div>
        <p id="next-cd" style="font-size:14px;font-weight:700;letter-spacing:2px;color:var(--color-level-1);margin:12px 0"></p>
        <a href="../app.html" class="btn btn-primary" style="text-decoration:none;text-align:center;display:block">ALL GAMES</a>
      </div>
    </div>

    <!-- Back to hub -->
    <a href="../app.html" style="position:fixed;top:calc(env(safe-area-inset-top, 0px) + 12px);left:12px;z-index:999;display:flex;align-items:center;gap:8px;text-decoration:none;padding:6px 14px 6px 6px;background:rgba(19,26,43,0.9);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.15);"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px;border-radius:6px;"><rect width="1024" height="1024" rx="224" fill="#131A2B"/><g transform="translate(512, 180)"><polygon points="0,-48 -56,28 0,4 56,28" fill="#E8A317"/><g fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"><line x1="-180" y1="660" x2="0" y2="0"/><line x1="180" y1="660" x2="0" y2="0"/><line x1="-100" y1="460" x2="100" y2="460"/></g></g></svg><span style="font-family:'Inter',-apple-system,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:rgba(255,255,255,0.9);">ACUMEN</span></a>

    <!-- Puzzle selector -->
    <div id="puzzle-nav">
      <button id="btn-prev-puzzle" class="btn-nav">&larr;</button>
      <span id="puzzle-label">Puzzle 1 / 10</span>
      <button id="btn-next-puzzle" class="btn-nav">&rarr;</button>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="hidden"></div>

  <script src="../daily.js"></script>
  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
