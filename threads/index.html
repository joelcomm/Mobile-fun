<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Threads">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Threads</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Threads</h1>
      <p class="subtitle">Group 4 words that share a thread</p>
    </header>

    <!-- Solved groups appear here -->
    <div id="solved-area"></div>

    <!-- Word grid -->
    <div id="grid"></div>

    <!-- Mistakes -->
    <div id="mistakes">
      Mistakes remaining:
      <span id="mistake-dots"></span>
    </div>

    <!-- Action buttons -->
    <div id="actions">
      <button id="btn-shuffle" class="btn btn-secondary">Shuffle</button>
      <button id="btn-deselect" class="btn btn-secondary" disabled>Deselect All</button>
      <button id="btn-submit" class="btn btn-primary" disabled>Submit</button>
    </div>

    <!-- Game over overlay -->
    <div id="overlay" class="hidden">
      <div id="overlay-content">
        <h2 id="overlay-title"></h2>
        <div id="overlay-results"></div>
        <div id="overlay-answers"></div>
        <p id="next-cd" style="font-size:14px;font-weight:700;letter-spacing:2px;color:var(--color-level-1);margin:12px 0"></p>
        <a href="../hub.html" class="btn btn-primary" style="text-decoration:none;text-align:center;display:block">ALL GAMES</a>
      </div>
    </div>

    <!-- Back to hub -->
    <a href="../hub.html" style="text-align:center;display:block;padding:8px;font-size:13px;color:#6b6b6b;text-decoration:none;letter-spacing:1px;">&larr; ALL GAMES</a>

    <!-- Puzzle selector -->
    <div id="puzzle-nav">
      <button id="btn-prev-puzzle" class="btn-nav">&larr;</button>
      <span id="puzzle-label">Puzzle 1 / 10</span>
      <button id="btn-next-puzzle" class="btn-nav">&rarr;</button>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="hidden"></div>

  <script src="../daily.js"></script>
  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
