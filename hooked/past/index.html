<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Past posts — Hooked</title>
  <meta name="description" content="Past Hooked pairs: which post the majority said was more likely to get engagement.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .pp { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
    .pp-h { display: flex; justify-content: space-between; font-size: 14px; color: var(--dim); margin-bottom: 10px; }
    .pp-h span:first-child { color: var(--text); font-weight: 700; }
    .pp .hk-row { margin-bottom: 8px; padding: 2px 0 12px; align-items: flex-start; border-radius: 0; overflow: visible; }
    .pp .hk-row i { top: auto; bottom: 0; height: 6px; border-radius: 3px; }
    .pp .hk-row.hk-top i { background: var(--blue); }
    .pp .hk-row-t { white-space: normal; line-height: 1.35; }
    .pp-mine { font-size: 13px; color: var(--dim); margin-top: 2px; }
    .pp-n { font-size: 14px; line-height: 1.45; color: var(--dim); margin-top: 8px; }
    .pp-n b { color: var(--text); }
    .pp-empty { color: var(--dim); font-size: 15px; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="hk">
    <header class="hk-head">
      <h1 class="hk-title">Past posts</h1>
      <p class="hk-meta">Final results, newest first</p>
    </header>
    <div id="pp-list"><p class="pp-empty">Loading&hellip;</p></div>
    <footer class="hk-foot"><a class="hk-link" href="../">&larr; Vote on today&rsquo;s pair</a></footer>
  </main>
  <script src="../hooks.js"></script>
  <script src="past.js"></script>
</body>
</html>
