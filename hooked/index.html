<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#170818">
  <title>Hooked</title>
  <meta name="description" content="Which of these two posts is more likely to get engagement? Vote and see what the majority said. A new pair every day.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="../x-embed.js"></script>
</head>
<body>
  <main class="hk">
    <header class="hk-head">
      <h1 class="hk-title">HOOKED <span aria-hidden="true">&#x1F3A3;</span></h1>
      <p id="hk-day" class="hk-day"></p>
      <p id="hk-streak" class="hk-streak hidden"></p>
    </header>

    <p id="hk-yesterday" class="hk-yesterday hidden"></p>

    <p id="hk-question" class="hk-question">Which of these two posts is more likely to get engagement? Vote and see what the majority said!</p>
    <p id="hk-topic" class="hk-topic"></p>
    <div id="hk-options" class="hk-options"></div>
    <p id="hk-ask" class="hk-ask">Tap a post to vote.</p>
    <p id="hk-error" class="hk-error hidden"></p>

    <section id="hk-after" class="hk-after hidden">
      <p id="hk-msg" class="hk-msg"></p>
      <button id="hk-share" class="hk-btn">SHARE ON X</button>
      <p id="hk-note" class="hk-note"></p>
    </section>

    <footer class="hk-foot">
      <p id="hk-cd" class="hk-cd"></p>
      <a class="hk-link" href="past/">Past posts and results &rarr;</a>
    </footer>
  </main>
  <script src="hooks.js"></script>
  <script src="game.js"></script>
</body>
</html>
