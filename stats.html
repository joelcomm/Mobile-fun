<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1024">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <title>Your Stats — Acumen</title>
  <style>
    @font-face { font-family: 'Title'; src: url('theme/fonts/Titan-One.woff2') format('woff2'); font-display: swap; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0d1024;
      --panel: #1a1e44;
      --text: #eef1ff;
      --dim: #a9b1e6;
      --ink: #0a0720;
      --lip: rgba(0, 0, 0, .45);
      --gold: #ffc83a;
      --green: #3ee08f;
      --cut: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      min-height: 100%;
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 16px;
      background:
        radial-gradient(130% 55% at 50% -6%, #3a2f8a 0%, transparent 70%),
        linear-gradient(180deg, var(--bg), #070916) #070916;   /* solid colour last, so nothing can ever show white */
      background-attachment: fixed;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 2px, transparent 2px 26px);
    }

    #app {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 18px;
      padding-top: calc(20px + var(--safe-top));
      padding-bottom: calc(28px + var(--safe-bottom));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── shared bevel pieces ──────────────────────────────── */
    .chamfer {
      clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)),
                         calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
    }
    .panel {
      --c: var(--gold);
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03)), var(--panel);
      border-top: 4px solid var(--c); border-bottom: 6px solid var(--lip);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.14);
    }
    .gold-btn {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
      padding: 10px 20px; font-size: 12px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #2a1500;
      background: linear-gradient(180deg, #ffe58a, #ffc83a 52%, #f0a800);
      border-bottom: 5px solid #a56a00; box-shadow: inset 0 3px 0 rgba(255,255,255,.5);
      clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
      transition: transform .1s;
    }
    .gold-btn:active { transform: translateY(3px); border-bottom-width: 2px; }

    .topbar { display: flex; }

    /* ── header ───────────────────────────────────────────── */
    header { text-align: center; padding: 14px 0 4px; }
    h1 {
      font-family: 'Title', 'Inter', sans-serif; font-weight: 400;
      font-size: clamp(46px, 12.5vw, 80px); line-height: 1; letter-spacing: .05em;
      padding: 4px 12px 14px; transform: rotate(-2deg);
      color: transparent;
      background: linear-gradient(180deg, #fff3b0 0 48%, #ffb400 50% 100%);
      -webkit-background-clip: text; background-clip: text;
      filter: drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink))
              drop-shadow(0 4px 0 #7a3b00) drop-shadow(0 8px 0 #7a3b00) drop-shadow(0 20px 14px rgba(0,0,0,.5));
    }
    .subtitle { font-size: 12px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: var(--dim); }
    #stats-date {
      display: inline-block; margin-top: 10px; padding: 5px 16px;
      font-size: 11px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--gold);
      background: rgba(255, 200, 58, .14);
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    }

    /* ── summary tiles ────────────────────────────────────── */
    .summary-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 26px; }
    .summary-card { padding: 16px 8px 14px; text-align: center; }
    .summary-num {
      font-family: 'Title', 'Inter', sans-serif; font-size: clamp(30px, 8.5vw, 42px); line-height: 1.05;
      color: var(--c); text-shadow: 0 3px 0 rgba(0,0,0,.4), 0 0 18px color-mix(in srgb, var(--c) 55%, transparent);
    }
    .summary-num small { font-size: .5em; opacity: .75; }
    .summary-label { margin-top: 6px; font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }

    /* ── countdown ────────────────────────────────────────── */
    .countdown-bar { margin-top: 14px; padding: 14px 20px 16px; text-align: center; }
    .countdown-label { font-size: 10px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); }
    .countdown-time {
      margin-top: 4px; font-size: 34px; font-weight: 900; letter-spacing: 4px; font-variant-numeric: tabular-nums;
      color: var(--gold); text-shadow: 0 3px 0 #7a3b00, 0 0 18px rgba(255, 200, 58, .45);
    }

    /* ── section headers ──────────────────────────────────── */
    .section-header { display: flex; align-items: center; gap: 16px; margin: 30px 0 16px; }
    .section-header::before, .section-header::after { content: ""; flex: 1; height: 3px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.22)); }
    .section-header::after { background: linear-gradient(270deg, transparent, rgba(255,255,255,.22)); }
    .section-label { font-size: 12px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); text-shadow: 0 0 14px rgba(255, 200, 58, .4); white-space: nowrap; }

    /* ── streak chart ─────────────────────────────────────── */
    .streak-panel { padding: 18px 14px 14px; }
    .streak-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
    .streak-col { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
    .streak-num { font-size: 12px; font-weight: 900; color: var(--text); }
    .streak-col.zero .streak-num { color: var(--dim); opacity: .6; }
    .streak-bar-wrap { width: 100%; height: 84px; display: flex; align-items: flex-end; border-bottom: 3px solid rgba(255,255,255,.2); }
    .streak-bar {
      width: 100%; min-height: 5px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff) 0, var(--c) 30%, color-mix(in srgb, var(--c) 55%, #000) 100%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 0 14px color-mix(in srgb, var(--c) 35%, transparent);
      clip-path: polygon(0 4px, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 0 100%);
      transform-origin: bottom; animation: grow .6s .15s cubic-bezier(.2,.9,.3,1.2) both;
    }
    .streak-col.zero .streak-bar { background: rgba(255,255,255,.14); box-shadow: none; }
    .streak-label { font-size: 8.5px; font-weight: 900; letter-spacing: .5px; color: var(--dim); }
    .streak-empty { margin-top: 12px; text-align: center; font-size: 12.5px; line-height: 1.5; color: var(--dim); }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    /* ── per-game rows ────────────────────────────────────── */
    .game-stats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .gs-card {
      --c: var(--gold);
      display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 14px;
      padding: 10px 14px 10px 10px; text-decoration: none; color: inherit;
      transition: transform .15s, filter .15s;
    }
    .gs-card:active { transform: translateY(3px); }
    @media (hover: hover) { .gs-card:hover { transform: translateY(-3px); filter: brightness(1.1); } }
    .gs-thumb {
      width: 64px; height: 64px; overflow: hidden; background: #000;
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    }
    .gs-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .gs-card.done .gs-thumb img { filter: saturate(.55) brightness(.7); }
    .gs-info { min-width: 0; }
    .gs-name {
      font-family: 'Title', 'Inter', sans-serif; font-size: 21px; letter-spacing: .04em; line-height: 1.1;
      color: var(--c); text-shadow: 0 3px 0 rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .gs-meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 700; color: var(--dim); }
    .gs-meta b { color: var(--text); font-weight: 800; }
    .gs-badge {
      display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 1.5px; padding: 6px 12px; color: #fff;
      border-bottom: 3px solid rgba(0,0,0,.45);
      clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
    }
    .gs-badge.done { background: linear-gradient(180deg, #34d98a, #138a4e); }
    .gs-badge.pending { color: #2a1500; background: linear-gradient(180deg, #ffe58a, #ffc83a 52%, #f0a800); border-bottom-color: #a56a00; }

    footer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: auto; padding-top: 34px; }
    .footer-logo { width: 26px; height: 26px; }
    .footer-logo svg { width: 100%; height: 100%; display: block; }
    .footer-text { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--dim); opacity: .8; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .gs-card, .summary-card, .countdown-bar, .streak-panel { animation: fadeInUp .4s ease-out both; }
    .summary-card:nth-child(2) { animation-delay: .05s; } .summary-card:nth-child(3) { animation-delay: .1s; }
    .gs-card:nth-child(1) { animation-delay: .03s; } .gs-card:nth-child(2) { animation-delay: .06s; }
    .gs-card:nth-child(3) { animation-delay: .09s; } .gs-card:nth-child(4) { animation-delay: .12s; }
    .gs-card:nth-child(5) { animation-delay: .15s; } .gs-card:nth-child(6) { animation-delay: .18s; }
    .gs-card:nth-child(7) { animation-delay: .21s; } .gs-card:nth-child(8) { animation-delay: .24s; }
    .gs-card:nth-child(9) { animation-delay: .27s; } .gs-card:nth-child(10) { animation-delay: .30s; }
    @media (prefers-reduced-motion: reduce) { .gs-card, .summary-card, .countdown-bar, .streak-panel, .streak-bar { animation: none; } }

    /* ── bigger screens: two columns of games ─────────────── */
    @media (min-width: 900px) {
      #app { max-width: 980px; }
      .game-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-row { gap: 18px; }
    }
    @media (max-width: 360px) {
      .gs-card { grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; }
      .gs-thumb { width: 52px; height: 52px; }
      .gs-name { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar"><a href="index.html" class="gold-btn">&larr; All Games</a></div>

    <header>
      <h1>YOUR STATS</h1>
      <p class="subtitle">Daily progress &amp; streaks</p>
      <p id="stats-date"></p>
    </header>

    <div class="summary-row">
      <div class="summary-card panel chamfer" style="--c:#3ee08f">
        <div id="sum-today" class="summary-num">0</div>
        <div class="summary-label">Done Today</div>
      </div>
      <div class="summary-card panel chamfer" style="--c:#ffc83a">
        <div id="sum-streak" class="summary-num">0</div>
        <div class="summary-label">Top Streak</div>
      </div>
      <div class="summary-card panel chamfer" style="--c:#b58cff">
        <div id="sum-total" class="summary-num">0</div>
        <div class="summary-label">Games Played</div>
      </div>
    </div>

    <div class="countdown-bar panel chamfer">
      <div class="countdown-label">Next daily puzzle</div>
      <div id="countdown" class="countdown-time">--:--:--</div>
    </div>

    <div class="section-header"><span class="section-label">Current Streaks</span></div>
    <div class="streak-panel panel chamfer">
      <div id="streak-chart" class="streak-grid"></div>
      <p id="streak-empty" class="streak-empty" hidden>No streaks yet. Finish a daily game, then come back tomorrow to start one.</p>
    </div>

    <div class="section-header"><span class="section-label">Daily Games</span></div>
    <div id="daily-games" class="game-stats"></div>

    <footer>
      <div class="footer-logo"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="1024" height="1024" rx="224" fill="#131A2B"/><g transform="translate(512, 180)"><g fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"><line x1="-180" y1="660" x2="0" y2="0"/><line x1="180" y1="660" x2="0" y2="0"/><line x1="-100" y1="460" x2="100" y2="460"/></g><polygon points="0,-90 -85,30 0,-5 85,30" fill="#E8A317"/></g></svg></div>
      <span class="footer-text">Acumen</span>
    </footer>
  </div>

  <script src="daily.js"></script>
  <script>
  (function () {
    // Same colours as the hub cards.
    var GAMES = [
      { key: 'threads',  name: 'Missing Link', abbr: 'LNK', color: '#ffbf4d', href: 'threads/' },
      { key: 'alibi',    name: 'Alibi',        abbr: 'ALI', color: '#ffc24a', href: 'alibi/' },
      { key: 'bluff',    name: 'Bluff',        abbr: 'BLF', color: '#ff6a52', href: 'bluff/' },
      { key: 'lineup',   name: 'Lineup',       abbr: 'LIN', color: '#5b8bff', href: 'lineup/' },
      { key: 'echo',     name: 'Echo',         abbr: 'ECH', color: '#b58cff', href: 'echo/' },
      { key: 'cipher',   name: 'Cipher',       abbr: 'CIP', color: '#3ee08f', href: 'cipher/' },
      { key: 'reflex',   name: 'Reflex',       abbr: 'RFX', color: '#ffc83a', href: 'reflex/' },
      { key: 'vanish',   name: 'Vanish',       abbr: 'VAN', color: '#19dcb8', href: 'vanish/' },
      { key: 'sequence', name: 'Sequence',     abbr: 'SEQ', color: '#5fa8ff', href: 'sequence/' },
      { key: 'rank',     name: 'Rank',         abbr: 'RNK', color: '#ffc83a', href: 'rank/' }
    ];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    document.getElementById('stats-date').textContent = Daily.getDateString();

    var todayCount = 0, bestStreak = 0, everPlayed = 0;
    var rows = GAMES.map(function (g) {
      var result = Daily.getDailyResult(g.key);
      var streak = Daily.getStreak(g.key);
      if (result) todayCount++;
      if (streak > bestStreak) bestStreak = streak;
      try {
        var sd = JSON.parse(localStorage.getItem(g.key + '-streak') || '{}');
        if (sd.lastDay) everPlayed++;
      } catch (e) {}
      return { g: g, played: !!result, score: result ? result.score : null, streak: streak };
    });

    document.getElementById('sum-today').innerHTML = todayCount + '<small>/' + GAMES.length + '</small>';
    document.getElementById('sum-streak').textContent = bestStreak;
    document.getElementById('sum-total').innerHTML = everPlayed + '<small>/' + GAMES.length + '</small>';

    // countdown to the next puzzle
    var cd = document.getElementById('countdown');
    function tick() { cd.textContent = Daily.formatCountdown(); }
    tick();
    setInterval(tick, 1000);

    // streak chart
    var maxStreak = Math.max(1, bestStreak);
    var chart = document.getElementById('streak-chart');
    rows.forEach(function (r) {
      var col = document.createElement('div');
      col.className = 'streak-col' + (r.streak > 0 ? '' : ' zero');
      col.style.setProperty('--c', r.g.color);
      var h = r.streak > 0 ? Math.max(Math.round(r.streak / maxStreak * 80), 10) : 5;
      col.innerHTML =
        '<div class="streak-num">' + r.streak + '</div>' +
        '<div class="streak-bar-wrap"><div class="streak-bar" style="height:' + h + 'px"></div></div>' +
        '<div class="streak-label">' + r.g.abbr + '</div>';
      chart.appendChild(col);
    });
    if (bestStreak === 0) document.getElementById('streak-empty').hidden = false;

    // per-game cards
    var list = document.getElementById('daily-games');
    rows.forEach(function (r) {
      var a = document.createElement('a');
      a.href = r.g.href;
      a.className = 'gs-card panel chamfer' + (r.played ? ' done' : '');
      a.style.setProperty('--c', r.g.color);
      var streakTxt = r.streak > 0 ? '🔥 <b>' + r.streak + '</b> day' + (r.streak === 1 ? '' : 's') : 'No streak';
      var scoreTxt = r.score !== null ? 'Score <b>' + esc(r.score) + '</b>' : '';
      a.innerHTML =
        '<div class="gs-thumb"><img src="img/cards/' + r.g.key + '.jpg" alt="" width="64" height="64" decoding="async"></div>' +
        '<div class="gs-info">' +
          '<div class="gs-name">' + esc(r.g.name) + '</div>' +
          '<div class="gs-meta"><span>' + streakTxt + '</span>' + (scoreTxt ? '<span>' + scoreTxt + '</span>' : '') + '</div>' +
        '</div>' +
        '<span class="gs-badge ' + (r.played ? 'done' : 'pending') + '">' + (r.played ? '✓ DONE' : 'PLAY') + '</span>';
      list.appendChild(a);
    });
  })();
  </script>
</body>
</html>
