<body class="embed">
  <a href="https://games.aiforeveryoneshow.com/lineup/" target="_blank" rel="noopener" class="embed-brand" data-external>ACUMEN &middot; FULL GAME &#x2197;</a>
  <div id="app">

    <!-- Title Screen -->
    <div id="title-screen">
      <h1 class="game-title"><span class="title-icon">&#x1F4CA;</span> LINEUP</h1>
      <p class="tagline">PUT THEM IN ORDER. TRUST YOUR GUT.</p>
      <p class="embed-howto"><span class="hl">Drag</span> 5 items into order &middot; 3 tries a round &middot; 5 rounds</p>

      <p id="best-score" class="best-score"></p>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">

        <span id="score-label" class="score-label">0</span>

      <button id="btn-lock" class="btn-main btn-lock">LOCK IN</button>
      <div id="round-feedback" class="round-feedback hidden">
        <p id="rf-text" class="rf-text"></p>
        <div id="rf-correct-order" class="rf-correct-order"></div>
        <button id="btn-next-round" class="btn-main btn-next-round">NEXT</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="hidden">
      <h2 class="gameover-heading">ALL DONE</h2>
      <div id="final-score" class="final-score"></div>
      <div id="final-rank" class="final-rank"></div>
      <div id="final-stats" class="final-stats"></div>
