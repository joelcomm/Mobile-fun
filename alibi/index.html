<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f8f8fa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <title>Alibi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../app.html" class="back-link"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" rx="224" fill="#131A2B"/><g transform="translate(512, 180)"><polygon points="0,-48 -56,28 0,4 56,28" fill="#E8A317"/><g fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"><line x1="-180" y1="660" x2="0" y2="0"/><line x1="180" y1="660" x2="0" y2="0"/><line x1="-100" y1="460" x2="100" y2="460"/></g></g></svg><span>ACUMEN</span></a>
  <div id="app">

    <!-- Title Screen -->
    <div id="title-screen">
      <div class="title-icon">&#x1F575;</div>
      <h1 class="game-title">ALIBI</h1>
      <p class="tagline">9 WORDS. 8 HAVE ALIBIS. FIND THE CULPRIT.</p>
      <div class="rules-box">
        <p><span class="hl">Eight words</span> share a hidden connection.</p>
        <p><span class="hl">One word</span> doesn't belong — it's the culprit.</p>
        <p><span class="hl">Tap</span> the word with no alibi.</p>
      </div>
      <button id="btn-start" class="btn-main">START INVESTIGATION</button>
      <p id="best-score" class="best-score"></p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
      <div class="game-header">
        <span id="round-label" class="round-label">1 / 10</span>
        <span id="score-label" class="score-label">0</span>
      </div>
      <div id="progress-bar" class="progress-bar"></div>
      <p class="prompt-label">FIND THE CULPRIT</p>
      <p class="sub-label">One word doesn't belong</p>
      <div id="word-grid" class="word-grid"></div>
      <div id="feedback" class="feedback hidden">
        <p id="fb-result" class="fb-result"></p>
        <p id="fb-category" class="fb-category"></p>
        <p id="fb-explain" class="fb-explain"></p>
        <button id="btn-next" class="btn-main btn-sm">NEXT</button>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameover-screen" class="hidden">
      <h2 class="gameover-heading">CASE CLOSED</h2>
      <div id="final-score" class="final-score"></div>
      <div id="final-rank" class="final-rank"></div>
      <div id="final-stats" class="final-stats"></div>
      <p id="next-cd" style="font-size:14px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:16px"></p>
      <a href="../app.html" class="btn-main" style="text-decoration:none;text-align:center;display:block;width:auto;margin:0 auto">ALL GAMES</a>
    </div>

  </div>
  <script src="../daily.js"></script>
  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
