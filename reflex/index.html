<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f8f8fa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <title>Reflex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../app.html" class="back-link"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" rx="224" fill="#131A2B"/><g transform="translate(512, 180)"><g fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"><line x1="-180" y1="660" x2="0" y2="0"/><line x1="180" y1="660" x2="0" y2="0"/><line x1="-100" y1="460" x2="100" y2="460"/></g><polygon points="0,-90 -85,30 0,-5 85,30" fill="#E8A317"/></g></svg><span>ACUMEN</span></a>
  <div id="app">

    <!-- Title Screen -->
    <div id="title-screen">
      <div class="title-icon">&#x26A1;</div>
      <h1 class="game-title">REFLEX</h1>
      <p class="tagline">SORT FAST. THINK FASTER.</p>
      <div class="rules-box">
        <p><span class="hl">A word</span> appears in the center.</p>
        <p><span class="hl">Tap left or right</span> to sort it into the correct category.</p>
        <p><span class="hl">3 mistakes</span> and you're out. It speeds up!</p>
      </div>
      <button id="btn-start" class="btn-main">GO</button>
      <p id="best-score" class="best-score"></p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
      <div class="game-header">
        <span id="score-label" class="score-label">0</span>
        <span id="lives-label" class="lives-label"></span>
      </div>
      <div id="timer-bar" class="timer-bar">
        <div id="timer-fill" class="timer-fill"></div>
      </div>
      <div class="arena">
        <div class="word-zone">
          <p id="category-hint" class="category-hint"></p>
          <div id="word-display" class="word-display"></div>
          <p id="flash-feedback" class="flash-feedback"></p>
        </div>
        <div class="choice-row">
          <button id="btn-left" class="sort-btn sort-left">
            <span id="label-left" class="sort-cat-label"></span>
          </button>
          <button id="btn-right" class="sort-btn sort-right">
            <span id="label-right" class="sort-cat-label"></span>
          </button>
        </div>
      </div>
      <div id="streak-label" class="streak-label"></div>
    </div>

    <!-- Game Over -->
    <div id="gameover-screen" class="hidden">
      <h2 class="gameover-heading">TIME'S UP</h2>
      <div id="final-score" class="final-score"></div>
      <div id="final-rank" class="final-rank"></div>
      <div id="final-stats" class="final-stats"></div>
      <p id="next-cd" style="font-size:14px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:16px"></p>
      <a href="../app.html" class="btn-main" style="text-decoration:none;text-align:center;display:block;width:fit-content;margin:0 auto">ALL GAMES</a>
    </div>

  </div>
  <script src="../daily.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
