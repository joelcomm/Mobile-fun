<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f8f8fa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <title>Sequence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="../app.html" class="back-link"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" rx="224" fill="#131A2B"/><g transform="translate(512, 180)"><polygon points="0,-48 -56,28 0,4 56,28" fill="#E8A317"/><g fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"><line x1="-180" y1="660" x2="0" y2="0"/><line x1="180" y1="660" x2="0" y2="0"/><line x1="-100" y1="460" x2="100" y2="460"/></g></g></svg><span>ACUMEN</span></a>
  <div id="app">

    <!-- Title Screen -->
    <div id="title-screen">
      <div class="title-icon">&#x1F522;</div>
      <h1 class="game-title">SEQUENCE</h1>
      <p class="tagline">FIND THE PATTERN. COMPLETE THE SEQUENCE.</p>
      <div class="rules-box">
        <p><span class="hl">Study</span> the number sequence.</p>
        <p><span class="hl">Find</span> the pattern and pick the missing number.</p>
        <p><span class="hl">Solve</span> 5 rounds &mdash; streak bonus for consecutive correct!</p>
      </div>
      <button id="btn-start" class="btn-main">START</button>
      <p id="best-score" class="best-score"></p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
      <div class="game-header">
        <span id="round-label" class="round-label">1 / 10</span>
        <span id="score-label" class="score-label">0</span>
      </div>
      <div id="progress-bar" class="progress-bar"></div>

      <div class="seq-section">
        <p class="seq-label">What comes next?</p>
        <div id="seq-row" class="seq-row"></div>
        <div id="choices" class="choices"></div>
      </div>

      <div id="feedback" class="feedback hidden">
        <p id="feedback-result" class="feedback-result"></p>
        <p id="feedback-hint" class="feedback-hint"></p>
        <button id="btn-next" class="btn-main btn-next">NEXT</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="hidden">
      <h2 class="gameover-heading">COMPLETE</h2>
      <div id="final-score" class="final-score"></div>
      <div id="final-rank" class="final-rank"></div>
      <div id="final-stats" class="final-stats"></div>
      <p id="next-cd" style="font-size:14px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:16px"></p>
      <a href="../app.html" class="btn-main" style="text-decoration:none;text-align:center;display:block;margin:0 auto">ALL GAMES</a>
    </div>

  </div>
  <script src="../daily.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
